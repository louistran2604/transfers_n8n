services:
  llama:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda12-b10524@sha256:9810cc5f409cbebb6412ee351190698b381aa0261fa96ea150738094bde1269d}
    container_name: transfers-llama
    restart: unless-stopped
    init: true
    gpus: all
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8081:8080"
    command:
      - --model
      - /models/${MODEL_FILE:-Qwen3.8-27B-UD-Q3_K_XL.gguf}
      - --alias
      - ${MODEL_ALIAS:-qwen3.8-27b}
      - --sleep-idle-seconds
      - ${SLEEP_IDLE_SECONDS:-30}
      - --ctx-size
      - "8192"
      - --gpu-layers
      - all
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --parallel
      - "1"
      - --fit
      - "on"
      - --fit-target
      - "1024"
      - --n-predict
      - "2048"
      - --reasoning
      - "off"
      - --cors-origins
      - localhost
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --offline
      - --no-webui
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "5"
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 5m
    networks:
      transfers_net:
        aliases:
          - llama

networks:
  transfers_net:
    external: true
