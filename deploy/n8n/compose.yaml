name: bill

services:
  n8n:
    build: .
    container_name: n8n_bill
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_BROKER_PORT=5679
      - X_COLLECTOR=${X_COLLECTOR:?X_COLLECTOR is required}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
      - TWSCRAPE_BASE_URL=${TWSCRAPE_BASE_URL:-http://twscrape:8080}
      - PLAYER_ENRICHMENT_MODE=${PLAYER_ENRICHMENT_MODE:-off}
      - SOFASCORE_ENRICHMENT_BASE_URL=http://sofascore-enrichment:8080
      - DISCORD_TRANSFERS_WEBHOOK_URL=${DISCORD_TRANSFERS_WEBHOOK_URL:?DISCORD_TRANSFERS_WEBHOOK_URL is required}
      - DISCORD_ERRORS_WEBHOOK_URL=${DISCORD_ERRORS_WEBHOOK_URL:?DISCORD_ERRORS_WEBHOOK_URL is required}
    volumes:
      - bill_n8n_data:/home/node/.n8n
      - ../../workflow:/workflows:ro
    networks:
      - default
      - transfers_net

  n8n-runner:
    build: ./runners
    container_name: n8n_bill_runner
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - X_COLLECTOR=${X_COLLECTOR:?X_COLLECTOR is required}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
    depends_on:
      - n8n

  twscrape:
    build: ./twscrape
    image: transfers-n8n-twscrape:local
    profiles: ["twscrape"]
    restart: unless-stopped
    environment:
      - TWSCRAPE_AUTH_TOKEN=${TWSCRAPE_AUTH_TOKEN:?TWSCRAPE_AUTH_TOKEN is required for twscrape}
      - TWSCRAPE_CT0=${TWSCRAPE_CT0:?TWSCRAPE_CT0 is required for twscrape}
      - TWS_TELEMETRY=0
      - TWS_LOG_LEVEL=WARNING
    volumes:
      - twscrape_accounts:/data
    networks:
      - transfers_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  sofascore-enrichment:
    build: ./sofascore
    image: transfers-n8n-sofascore-enrichment:local
    profiles: ["enrichment"]
    restart: unless-stopped
    environment:
      - SOCCERDATA_DIR=/data/soccerdata
    volumes:
      - sofascore_cache:/data/soccerdata
    networks:
      - transfers_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: 1.0
    mem_limit: 1g
    stop_grace_period: 15s

volumes:
  bill_n8n_data:
    driver: local
  twscrape_accounts:
    driver: local
  sofascore_cache:
    driver: local

networks:
  transfers_net:
    external: true
